      padding: 40px 20px;

      color: #4a0505;

      margin-bottom: 1.2rem;
    }

    ul {
      list-style-type: square;
      padding-left: 20px;
      margin: 0;
    }

    li {
      margin-bottom: 0.85rem;
      color: #4a0505;
    }

    /* Enlaces subrayados con tipografía negrita */
    li a {
      color: #4a0505;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: underline;
      transition: opacity 0.2s ease;
    }

    li a:hover {
